<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reviews</title>
<meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="assets/css/reviews-widget.css">
<style>html,body{margin:0;background:transparent}</style>
</head>
<body>
<!-- Bare widget page (safe to iframe). Defaults to the bundled fictional example/.
     Override with ?source=<data-repo-url>. Options: &layout=&platform=&limit=&summary=off&theme=light|dark|auto
     Constrained box: &constrained=true  (optional overrides: fixed-height, arrows, overflow, hover-lift, focus-ring, cards, padding)
     Page chrome stays transparent so the host page’s background shows through. -->
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    if (!q.has('source')) {
      q.set('source', new URL('example/', location.href).href);
      history.replaceState(null, '', location.pathname + '?' + q + location.hash);
    }
  })();
</script>
<script src="assets/js/reviews-widget.js" defer data-overflow="visible"></script>
</body>
</html>
